services:
  postgres:
    image: postgres:16
    container_name: hpc-rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hpc_rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: hpc-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/hpc_rag_db
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

volumes:
  postgres_data: